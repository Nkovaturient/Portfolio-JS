<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PLDG Portfolio · Neha Kumari</title>
  <link rel="icon" href="./assets/pldg impact.jpg">
  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #030a14;
    }

    #pldg-root {
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>
  <div id="pldg-root"></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script>
    (function () {
      var root = document.getElementById('pldg-root');
      if (!window.Babel || !window.React || !window.ReactDOM) {
        root.textContent = 'Portfolio scripts failed to load.';
        return;
      }
      fetch('./pldgfolio.jsx', { cache: 'no-cache' })
        .then(function (response) {
          if (!response.ok) throw new Error('pldgfolio.jsx ' + response.status);
          return response.text();
        })
        .then(function (src) {
          var out = Babel.transform(src, {
            filename: 'pldgfolio.jsx',
            sourceType: 'script',
            presets: [['react', { runtime: 'classic' }]],
          });
          var script = document.createElement('script');
          script.text = out.code;
          document.body.appendChild(script);
        })
        .catch(function (err) {
          root.textContent = 'Portfolio failed to compile: ' + err.message;
        });
    })();
  </script>
</body>

</html>
